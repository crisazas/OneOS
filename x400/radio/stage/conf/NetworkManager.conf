[main]
auth-polkit=false
plugins=keyfile
no-auto-default=*
dhcp=internal
dns=default
rc-manager=symlink
systemd-resolved=false

[keyfile]
unmanaged-devices=except:interface-name:wlan0
path=/etc/NetworkManager/system-connections

[device]
wifi.backend=wpa_supplicant
wifi.scan-rand-mac-address=no

[connection]
wifi.powersave=2
ipv4.route-table=1014
ipv6.route-table=1014

[connectivity]
enabled=true
uri=http://nmcheck.gnome.org/check_network_status.txt
response=NetworkManager is online
interval=300

[logging]
level=INFO
domains=WIFI,SUPPLICANT,DEVICE,PLATFORM,DHCP4,IP4
