# Static ALSA nodes for the Exynos A-Box. The session has no udev, so the SPA
# ALSA monitor (and WirePlumber on top of it) finds no devices; these two nodes
# open the PCMs directly.  Speaker PCM: card 0 device 7 (RDMA7, the one
# media-speaker routes to UAIF1 and the aw882xx pair).  Microphone: card 0
# device 13 (WDMA1, fed by UAIF6 / serial LIF DMIC, 4 ch 24 bit in a 32 bit slot).
context.objects = [
    {   factory = adapter
        args = {
            factory.name           = api.alsa.pcm.sink
            node.name              = "x400.speakers"
            node.description       = "Altavoces"
            media.class            = "Audio/Sink"
            api.alsa.path          = "hw:0,7"
            api.alsa.period-size   = 480
            api.alsa.headroom      = 0
            audio.format           = "S32LE"
            audio.rate             = 48000
            audio.channels         = 2
            audio.position         = [ FL FR ]
            session.suspend-timeout-seconds = 0
        }
    }
    {   factory = adapter
        args = {
            factory.name           = api.alsa.pcm.source
            node.name              = "x400.microphone"
            node.description       = "Microfono"
            media.class            = "Audio/Source"
            api.alsa.path          = "hw:0,13"
            api.alsa.period-size   = 96
            audio.format           = "S32LE"
            audio.rate             = 48000
            audio.channels         = 4
            audio.position         = [ FL FR RL RR ]
            session.suspend-timeout-seconds = 0
        }
    }
]
