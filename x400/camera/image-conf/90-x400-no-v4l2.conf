# The kernel's /dev/video* are Samsung's ISP (exynos-is), not cameras a client can use: the cameras come from x400-camsrc (x400/camera).
# Without this, WirePlumber lists 15 useless v4l2 nodes next to them. Also no libcamera and no bluez monitor until the radio group enables Bluetooth.
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
  }
}
